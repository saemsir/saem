name: Deploy Saem Physics website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          mkdir -p site-out
          python3 tools/fetch_channel_feed.py site-out/channel-feed.json
          cp index.html style.css script.js student-studio.js site-out/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

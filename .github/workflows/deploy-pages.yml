name: Deploy Saem Physics website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Refresh paper inventory
        run: python3 dynamic-site/inventory_exam_papers.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Restore text-free exam index cache
        id: exam-corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: data/exam-corpus.json
          key: exam-corpus-v1-${{ hashFiles('tools/build_exam_corpus.py', 'dynamic-site/inventory_exam_papers.py', 'dynamic-site/data/paper_inventory.json', 'neet_exam/**/*.pdf', 'jee_exams/**/*.pdf', 'jeeadv_exams/**/*.pdf') }}
      - name: Verify the exam corpus and static engine
        run: |
          python3 -m pip install -r tools/requirements-exam-corpus.txt
          python3 tools/build_exam_corpus.py
          python3 tools/test_build_exam_corpus.py
          python3 tools/test_exam_corpus_data.py
          node tools/test_student_studio.js
      - name: Cache generated exam index
        if: steps.exam-corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/exam-corpus.json
          key: exam-corpus-v1-${{ hashFiles('tools/build_exam_corpus.py', 'dynamic-site/inventory_exam_papers.py', 'dynamic-site/data/paper_inventory.json', 'neet_exam/**/*.pdf', 'jee_exams/**/*.pdf', 'jeeadv_exams/**/*.pdf') }}
      - name: Prepare the static site
        run: |
          mkdir -p site-out/data
          python3 tools/fetch_channel_feed.py site-out/channel-feed.json
          cp index.html style.css script.js student-studio.js site-out/
          cp data/exam-corpus.json site-out/data/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
